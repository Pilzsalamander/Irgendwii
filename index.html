<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sektherstellung Rechner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #f4f4f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border: 3px solid #2c3e50;
            max-width: 480px;
            width: 100%;
            padding: 40px;
            box-shadow: 8px 8px 0 rgba(44, 62, 80, 0.2);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 24px;
            letter-spacing: -1px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .bubbles {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            margin-bottom: 20px;
        }

        .bubble {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #95a5a6;
        }

        .slider-container {
            margin: 30px 0;
        }

        label {
            display: block;
            font-size: 14px;
            color: #2c3e50;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: #ecf0f1;
            border-radius: 3px;
            outline: none;
            border: 2px solid #bdc3c7;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background-color: #2c3e50;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 2px 2px 0 rgba(44, 62, 80, 0.3);
        }

        .value-display {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #2c3e50;
            margin-top: 10px;
        }

        .results {
            background-color: #ecf0f1;
            border: 2px solid #bdc3c7;
            padding: 20px;
            margin-top: 20px;
            font-size: 14px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed #bdc3c7;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-label {
            color: #666;
            font-weight: bold;
        }

        .result-value {
            font-size: 18px;
            color: #2c3e50;
            font-weight: bold;
        }

        .note {
            margin-top: 15px;
            padding: 10px;
            background-color: #f9f9f9;
            border-left: 4px solid #2c3e50;
            font-size: 12px;
            color: #666;
            line-height: 1.6;
        }

        .note strong {
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sektherstellung</h1>
        <p class="subtitle">CO₂-Druck & Zuckerbedarf Rechner</p>

        <div class="bubbles">
            <span style="font-size: 9px; color: #95a5a6;">↑</span>
            <span style="font-size: 9px; color: #95a5a6;">↓</span>
            <span style="font-size: 9px; color: #95a5a6;">→</span>
        </div>

        <div class="slider-container">
            <label for="pressureSlider">Druck (bei 20°C)</label>
            <input type="range" id="pressureSlider" min="1" max="6" step="0.5" value="3">
            <div class="value-display"><span id="pressureValue">3</span> bar</div>
        </div>

        <div class="results">
            <div class="result-item">
                <span class="result-label">CO₂ pro Liter:</span>
                <span class="result-value" id="co2Value">19.5 g/L</span>
            </div>
            <div class="result-item">
                <span class="result-label">Zucker pro Liter:</span>
                <span class="result-value" id="sugarValue">30 g/L</span>
            </div>
        </div>

        <div class="note">
            <strong>Hinweis:</strong> Bei 20°C beträgt die CO₂-Aufnahme ca. 6,5 g pro Liter und Bar. 
            Zucker fermentiert im Flascheninneren zu CO₂.
        </div>
    </div>

    <script>
        const slider = document.getElementById('pressureSlider');
        const pressureDisplay = document.getElementById('pressureValue');
        const co2Display = document.getElementById('co2Value');
        const sugarDisplay = document.getElementById('sugarValue');

        const co2PerBarAt20C = 6.5;

        function updateCalculations() {
            const pressure = parseFloat(slider.value);
            
            const co2Grams = pressure * co2PerBarAt20C;
            const sugarPerLiter = co2Grams / 0.53;

            pressureDisplay.textContent = pressure.toFixed(1);
            co2Display.textContent = co2Grams.toFixed(1) + ' g/L';
            sugarDisplay.textContent = sugarPerLiter.toFixed(0) + ' g/L';
        }

        slider.addEventListener('input', updateCalculations);
        
        updateCalculations();
    </script>
</body>
</html>
